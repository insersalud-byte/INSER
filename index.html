<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inser Salud</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Santi AI Widget (n8n) -->
  <script>
    (function () {
      // === CONFIG ===
      const WEBHOOK_URL = "https://n8n.srv947061.hstgr.cloud/webhook/581f4c6c-83cc-497f-8fb8-93a66a8090ce/chat";
      const PORTAL_ID = "inser-n8n-portal";

      // 1) Inyectar CSS crítico (anticorte + tamaño responsivo)
      var css = `
          :root{
            --chat--window--width: 420px;
            --chat--window--height: min(78vh, 680px);
            --chat--border-radius: 16px;
          }
          @media (max-width:640px){
            :root{
              --chat--window--width: 100vw;
              --chat--window--height: 100vh;
              --chat--border-radius: 0px;
            }
          }
          @supports (height: 100svh){
            @media (max-width:640px){
              :root{ --chat--window--height: 100svh; }
            }
          }
          html, body { overflow: visible !important; transform: none !important; }
        `;
      var style = document.createElement('style');
      style.textContent = css;
      document.head.appendChild(style);

      // 2) Cargar el bundle del widget n8n SIN type="module"
      var s = document.createElement('script');
      s.src = "https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.umd.js";
      s.async = true;
      s.onload = init;
      document.head.appendChild(s);

      function ensurePortal() {
        let el = document.getElementById(PORTAL_ID);
        if (!el) {
          el = document.createElement("div");
          el.id = PORTAL_ID;
          document.body.appendChild(el);
        } else if (el.parentElement !== document.body) {
          document.body.appendChild(el); // si el builder lo movió, lo devolvemos al body
        }
        return el;
      }

      function forceFixed() {
        // Forzar posición/z-index del contenedor real que crea n8n
        var el = document.querySelector("#n8n-chat, [id^='n8n-chat'], .n8n-chat, [class*='n8n-chat']");
        if (el) {
          el.style.setProperty("position", "fixed", "important");
          el.style.setProperty("right", "20px", "important");
          el.style.setProperty("bottom", "20px", "important");
          el.style.setProperty("left", "auto", "important");
          el.style.setProperty("top", "auto", "important");
          el.style.setProperty("z-index", "2147483647", "important");
        }
        // Quitar transform/overflow que recortan
        document.documentElement.style.setProperty("overflow", "visible", "important");
        document.documentElement.style.setProperty("transform", "none", "important");
        document.body.style.setProperty("overflow", "visible", "important");
        document.body.style.setProperty("transform", "none", "important");
      }

      function init() {
        // 3) Crear portal en el <body> aunque no puedas editarlo
        ensurePortal();

        // 4) Crear el chat con UI en español
        // global n8nChat se expone por el bundle UMD
        if (window.n8nChat && typeof window.n8nChat.createChat === "function") {
          window.n8nChat.createChat({
            target: "#" + PORTAL_ID,
            mode: "window",
            webhookUrl: WEBHOOK_URL,
            loadPreviousSession: true,
            defaultLanguage: "es",
            i18n: {
              es: {
                title: "Inser Salud",
                subtitle: "Estamos para ayudarte",
                footer: "",
                getStarted: "Nueva conversación",
                inputPlaceholder: "Escribí tu consulta…"
              }
            },
            initialMessages: [
              "👋 ¡Hola! Soy Santi, tu asistente de Inser Salud.",
              "¿En qué puedo ayudarte hoy?"
            ],
          });
          // 5) Anticorte + reintentos + vigilancia de cambios del builder
          forceFixed();
          setTimeout(forceFixed, 300);
          setTimeout(forceFixed, 1000);
          new MutationObserver(forceFixed)
            .observe(document.documentElement, { attributes: true, attributeFilter: ["style", "class"], subtree: true });
        } else {
          console.error("[InserChat] n8nChat.createChat no disponible");
        }
      }
    })();
  </script>
</body>

</html>
